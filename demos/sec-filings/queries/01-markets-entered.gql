-- Which markets does each company say it is entering?
--
-- Extracted from 10-K prose by Gemini, so this is what companies *tell
-- regulators* they are doing — a different and often earlier signal than what
-- they tell the press.
GRAPH `${GCP_PROJECT}.${BQ_DATASET}.${BQ_GRAPH}`
MATCH (c:Company)-[:ENTERING]->(m:Market)
RETURN c.id AS company, m.label AS market, m.market_action AS action, m.evidence AS evidence
ORDER BY company, market
LIMIT 50
