-- Where does value concentrate in a single day?
--
-- The top of this list is almost always exchanges, bridges, and mixers rather
-- than individuals. That is the useful baseline: know your hubs before you read
-- anything into a path that runs through one.
GRAPH `${GCP_PROJECT}.${BQ_DATASET}.${BQ_GRAPH}`
MATCH (sender:Address)-[s:SENT]->(hub:Address)
RETURN
  hub.address              AS hub,
  COUNT(DISTINCT sender.id) AS distinct_senders,
  SUM(s.total_eth)         AS eth_received
GROUP BY hub
ORDER BY eth_received DESC
LIMIT 25
