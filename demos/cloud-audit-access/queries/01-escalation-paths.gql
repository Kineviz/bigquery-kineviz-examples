-- THE query this demo exists for.
--
-- Principals that touch nothing sensitive directly, but reach it by
-- impersonating something that can. An access review built on direct grants
-- shows these people as harmless. The graph shows otherwise.
GRAPH `${PROJECT}.${DATASET}.${GRAPH}`
MATCH (actor:Principal)-[:CAN_IMPERSONATE]->(proxy:Principal)-[a:ACCESSED]->(r:Resource)
WHERE r.sensitivity IN ('high', 'critical')
  AND NOT EXISTS {
    MATCH (actor)-[:ACCESSED]->(direct:Resource)
    WHERE direct.sensitivity IN ('high', 'critical')
  }
RETURN
  actor.name  AS actor,
  actor.principal_type AS actor_type,
  proxy.name  AS impersonates,
  r.name      AS reaches,
  r.sensitivity AS sensitivity,
  a.call_count AS calls
ORDER BY sensitivity DESC, actor
