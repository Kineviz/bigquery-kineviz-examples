name: secrets

on:
  pull_request:
  push:
    branches: [main]

# Blocking, from the first commit. These repos are public, they hand out
# service-account instructions, and a sibling repo already shipped a committed
# .env — so this gate exists before anyone can make that mistake here.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-credential-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt and braces: gitleaks catches key *contents*, this catches a
      # committed .env or key file even if it is empty or placeholder-only.
      - name: Reject committed credential files
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(\.env|.*\.env)$|(^|/).*key\.json$|(^|/).*credentials.*\.json$' \
                | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Credential files must never be committed:"
            echo "$bad"
            echo "Use .env.example with placeholders instead."
            exit 1
          fi
          echo "no credential files committed"
